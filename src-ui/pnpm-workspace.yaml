packages:
  - "."
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
allowBuilds:
  "@parcel/watcher": true
  canvas: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  normalize-diacritics: false
  unrs-resolver: false
onlyBuiltDependencies:
  - "@parcel/watcher"
  - canvas
  - esbuild
  - lmdb
  - msgpackr-extract
ignoredBuiltDependencies:
  - normalize-diacritics
  - unrs-resolver
