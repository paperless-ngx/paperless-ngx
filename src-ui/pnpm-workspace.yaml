packages:
  - "."
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1 || 5.7.2"
allowBuilds:
  "@parcel/watcher": true
  canvas: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  normalize-diacritics: false
  unrs-resolver: false
onlyBuiltDependencies:
  - "@parcel/watcher"
  - canvas
  - esbuild
  - lmdb
  - msgpackr-extract
ignoredBuiltDependencies:
  - normalize-diacritics
  - unrs-resolver
