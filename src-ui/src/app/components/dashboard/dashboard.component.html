<div class="row">
  <div class="col-12 mb-4">
    <div class="unified-card shadow-sm">
      <div class="unified-grid">

        <!-- Multi-source heterogeneous data processing pipeline -->
        <div class="unified-pane pipeline-pane">
          <pngx-pipeline-widget></pngx-pipeline-widget>
        </div>

        <div class="unified-divider d-none d-lg-block" aria-hidden="true"></div>

        <!-- Insights: Total Documents + File Type Distribution -->
        <div class="unified-pane stats-pane">
          <pngx-statistics-widget *pngxIfPermissions="{ action: PermissionAction.View, type: PermissionType.UISettings }"></pngx-statistics-widget>
        </div>

      </div>
    </div>
  </div>

  @if (settingsService.offerTour() || dashboardViews.length > 0) {
    <div class="col-12 col-lg-8 col-xl-9 mb-4">
      <div class="row row-cols-1 g-4"
        cdkDropList
        [cdkDropListDisabled]="settingsService.globalDropzoneActive"
        (cdkDropListDropped)="onDrop($event)"
        >
        @if (settingsService.offerTour()) {
          <div class="col">
            <pngx-welcome-widget (dismiss)="completeTour()"></pngx-welcome-widget>
          </div>
        }

        <ng-container *pngxIfPermissions="{ action: PermissionAction.View, type: PermissionType.SavedView }">
          @for (v of dashboardViews; track v.id) {
            <div class="col">
              <pngx-saved-view-widget
                [savedView]="v"
                (cdkDragStarted)="onDragStart($event)"
                (cdkDragEnded)="onDragEnd($event)"
                >
              </pngx-saved-view-widget>
            </div>
          }
        </ng-container>
      </div>
    </div>
  }
</div>
