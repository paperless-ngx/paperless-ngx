name: Fork image and isolated review
on:
  push:
    branches: [dev_szaiser]
    tags: ['szaiser-v*']
  pull_request:
    branches: [dev_szaiser]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  backend:
    uses: ./.github/workflows/ci-backend.yml
    with:
      force_all: true
  frontend:
    uses: ./.github/workflows/ci-frontend.yml
    with:
      force_all: true
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PAPERLESS_TEST_ENGINE: docker
      PAPERLESS_TEST_IMAGE: paperless-fork-test:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify synthetic-only lab contract
        run: python -m unittest discover -s fork/tests -v
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the upstream Dockerfile
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.PAPERLESS_TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/szaiser/paperless-ngx
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fork-amd64
          cache-to: type=gha,scope=fork-amd64,mode=max
      - name: Start isolated stack
        run: bash fork/lab.sh up
      - name: Test native suggestions with the upstream fixture
        run: bash fork/lab.sh smoke
      - name: Install browser acceptance tooling
        run: python -m pip install playwright==1.59.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify native suggestion selection and Save
        run: python fork/browser_smoke.py
      - name: Logs on failure (synthetic data only)
        if: failure()
        run: bash fork/lab.sh logs
      - name: Stop isolated stack
        if: always()
        run: bash fork/lab.sh down
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && github.repository == 'szaiser/paperless-ngx'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.repository == 'szaiser/paperless-ngx'
        env:
          FORK_COMMIT: ${{ github.sha }}
          FORK_REF_TYPE: ${{ github.ref_type }}
          FORK_REF_NAME: ${{ github.ref_name }}
        run: bash fork/publish.sh
