name: AppPort bridge

on:
  pull_request:
    paths:
      - "appport-bridge/**"
      - ".github/workflows/appport-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_UV_VERSION: "0.12.x"

jobs:
  consumer-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: ${{ steps.setup-python.outputs.python-version }}
      - name: Install Python dependencies (API only; no OCR system packages needed)
        env:
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
        run: uv sync --python "${PYTHON_VERSION}" --frozen
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install bridge (published @appport packages, exact pins)
        working-directory: appport-bridge
        run: npm ci
      - name: Independent consumer test against a real Paperless-ngx server
        working-directory: appport-bridge
        env:
          PAPERLESS_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm test
