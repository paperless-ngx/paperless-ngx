name: Coursework CI
on:
  push:
  pull_request:
    branches:
      - dev
  workflow_dispatch:
permissions:
  contents: read
env:
  DEFAULT_UV_VERSION: "0.12.x"
concurrency:
  group: coursework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pbt-04:
    name: PBT-04 MIME-extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Run PBT-04 clean-machine demo and save evidence
        shell: bash
        env:
          PBT04_ARTIFACT_DIR: .artifacts
        run: bash scripts/demo-pbt-04.sh
      - name: Run parser regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          uv run --python 3.12 --group testing --frozen pytest src/documents/tests/test_parsers.py -n 0 --hypothesis-seed=13 --junitxml=.artifacts/regressions.xml 2>&1 | tee .artifacts/regressions.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbt-04-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
  setup:
    name: Validate coursework setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check files and whitespace
        shell: bash
        run: |
          test -s README.md
          test -s docs/software-testing-project.md
          git diff --check HEAD^
  pbt-01:
    name: PBT-01 text normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Run PBT-01 clean-machine demo and save evidence
        shell: bash
        env:
          PBT01_ARTIFACT_DIR: .artifacts
        run: bash scripts/demo-pbt-01.sh
      - name: Upload PBT-01 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-01-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
  pbt-02:
    name: PBT-02 Unicode search normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: 3.12
      - name: Run PBT-02 clean-machine demo and save evidence
        shell: bash
        env:
          PBT02_ARTIFACT_DIR: .artifacts
        run: bash scripts/demo-pbt-02.sh
      - name: Upload PBT-02 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-02-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
  pbt-03:
    name: PBT-03 path security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - name: Run PBT-03 and save evidence log
        shell: bash
        env:
          HYPOTHESIS_PROFILE: recorded
        run: |
          set -o pipefail
          mkdir -p .artifacts
          uv run --python 3.12 --dev --frozen pytest src/documents/tests/test_path_security.py -k TestPathSecurity -n 0 -v --hypothesis-seed=20261008 --hypothesis-show-statistics --cov=documents.file_handling --cov-branch --cov-report=term-missing 2>&1 | tee .artifacts/pbt-03-run.log
      - name: Upload PBT-03 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-03-evidence
          path: .artifacts/pbt-03-run.log
  pbt-05:
    name: PBT-05 Parser selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - name: Run PBT-05 clean-machine demo and save evidence
        shell: bash
        env:
          PBT05_ARTIFACT_DIR: .artifacts
        run: bash scripts/demo-pbt-05.sh
      - name: Upload PBT-05 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-05-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
