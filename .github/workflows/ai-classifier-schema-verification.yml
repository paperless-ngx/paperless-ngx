name: AI classifier schema verification

on:
  push:
    branches:
      - fix/ai-required-classification-fields
  workflow_dispatch:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'pydantic>=2,<3' 'llama-index-core>=0.12,<1'
      - name: Verify tool schema and LlamaIndex integration
        run: |
          PYTHONPATH=src python - <<'PY'
          from paperless_ai.base_model import DocumentClassifierSchema, DocumentClassifierToolSchema
          from llama_index.core.program.function_program import get_function_tool

          required = {'title', 'tags', 'correspondents', 'document_types', 'storage_paths'}
          schema = DocumentClassifierToolSchema.model_json_schema()
          assert required <= set(schema['required']), schema
          assert 'tags' not in DocumentClassifierSchema.model_json_schema()['required']
          tool = get_function_tool(DocumentClassifierToolSchema)
          assert tool.metadata.name == 'DocumentClassifierSchema', tool.metadata.name
          parameters = tool.metadata.get_parameters_dict()
          assert required <= set(parameters['required']), parameters
          parsed = DocumentClassifierSchema(title='Test')
          assert parsed.tags == [] and parsed.correspondents == []
          print('Schema and LlamaIndex tool integration passed')
          PY
