title: "[Feature Request] "
body:
  - type: markdown
    attributes:
      value: |
        #### Use of AI tools

        If this request was generated, in whole or in part, by an AI tool or agent you **must** say so using the field below. Failing to clearly disclose this is a violation of our [Code of Conduct](https://github.com/paperless-ngx/paperless-ngx/blob/main/CODE_OF_CONDUCT.md).

        The project prefers thoughtful, well-described ideas to AI-generated content. Please describe the problem, your use case, the desired behavior, and who would benefit.
  - type: dropdown
    id: ai-usage
    attributes:
      label: AI usage
      description: Was any part of this request written by an AI tool or agent?
      options:
        - No AI tools were used
        - Yes, AI tools helped write this request
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what you would like to see.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other
      description: Add any other context or information about the feature request here.
